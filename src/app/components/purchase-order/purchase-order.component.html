<div class="modal-header header-modal d-flex justify-content-between align-items-center px-3 py-2" (mousedown)="startDrag($event)">  
  <div class="d-flex align-items-center" >
    <h6 class="m-0">Nueva Orden de Compra</h6>
  </div>
  <div class="d-flex align-items-center gap-2">
    <button class="button-cancel" (click)="closeModal()">
      <i class="fa-solid fa-xmark"></i> 
    </button>
  </div>
</div>

<div class="modal-body body-modal p-3">
  <!-- Encabezado principal -->
  <div class="col-12 border border-1 rounded p-2">
    <!-- Botones -->
    <div class="d-flex gap-2 mb-2">
      <button class="button-header">
        <i class="fa-solid fa-calendar-days"></i> Cronograma Recepción
      </button>
        <button class="button-header">
        <i class="fa-solid fa-floppy-disk"></i> Guardar
        </button>
      <button class="button-header" (click)="openOutlook()">
        <i class="fa-solid fa-paper-plane"></i> Enviar
      </button>
    </div>
    <hr/>
    <div class="row align-items-center mb-2">  
        <!-- Datos empresa -->
      <div class="col-4 text-center">
        <div class="fw-bold" style="font-size: 11px;">BOTICAS PERU</div>
        <div class="company-data">OFICINA PRINCIPAL</div>
        <div class="company-data">JR. BALTAZAR GRADOS N° 810 - SJM - LIMA</div>
        <div class="company-data">TELÉFONO PRINCIPAL: 206-7000 ANEXO: 108</div>
      </div>
      <!-- Logo -->
      <div class="col-4 text-center order-section">
        <img [src]="logoHeader" alt="logo" width="200" />
      <!-- RUC y datos de orden -->
        <div class="row mb-1">
          <div class="col-12">
            <label>RUC:</label>
            <span class="fw-bold ms-2">20515346113</span>
          </div>
        </div>  
      </div>
      <!-- Orden de compra -->
      <div class="col-4 text-center order-section">
        <div class="fw-bold" style="font-size: 11px;">ORDEN COMPRA N°:</div>
        <input type="text" class="ms-1" style="width: 120px;" />
        <div class="company-data mt-1">
          FECHA DE CREACIÓN:
          <input type="date" value="2025-11-11" style="width: 120px;" />
        </div>
      </div>
    </div>
    <hr/>
    <div class="d-flex">

      <!-- Proveedor, RUC, Fecha Entrega -->
     <div class="col-4">
        <div class="col-4">
          <label>PROVEEDOR:</label>
          <input type="text" value="_CEDI ALIPIO PONCE" />
        </div>
        <div class="col-4">
          <label>RUC:</label>
          <input type="text"/>
        </div>
        <div class="col-4">
          <label>FACTURAR A:</label>
          <input type="text" value="_CORP. BOTICAS PERU SAC (ALMACEN)" />
        </div>
     </div>
    <!-- Facturar a, Dirección -->
    <div class="col-4">
  
      <div class="col-6">
        <label>DIRECCIÓN DE ENTREGA:</label>
        <select class="input-select" style="width: 210%;">
          <option>JR. BALTAZAR GRADOS N° 810</option>
          <option>JR. LOS OLIVOS 124</option>
        </select>
      </div>
            <div class="col-6">
        <label>FECHA DE ENTREGA:</label>
        <input type="date" value="2025-11-11" />
      </div>
    </div>
    <div class="col-4">

      <div class="col-12">
        <label>CONDICIÓN PAGO:</label>
        <select class="input-select">
          <option>[ SELECCIONE ]</option>
          <option>CONTADO</option>
          <option>CRÉDITO</option>
        </select>
      </div>
    </div>


    </div>
    
    <!-- Observación -->
    <div class="row">
      <div class="col-12">
        <label>OBSERVACIÓN:</label>
        <textarea rows="4" style="width: 100%; font-size:10px;"></textarea>
      </div>
    </div>
    <div class="row">
      <div class="col-12 table-fixed">
        
      </div>
    </div>
  </div>
</div>
