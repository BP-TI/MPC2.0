<div class="content">
  <div class="h-100 w-100 d-flex align-items-center p-0 m-0">
    <div class="col-8 order-md-2 m-0 p-0 h-100 w-100 imagenFondo"></div>
    <div class="col-4 contents m-0 p-0">
      <div class="row d-flex justify-content-center">
        <div class="col-md-8">
          <div class="mb-4 align-items-center">
            <img src="{{ logowhite }}" />
            <p class="mt-3 mb-4">Complete la información para ingresar.</p>
          </div>
          <form [formGroup]="loginForm" (ngSubmit)="logueo()" autocomplete="off">
            <div class="form-group last mb-4">
              <label for="lbUsuario">Usuario</label>
              <input
                [ngClass]="{
                  'is-invalid-input':
                    loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched
                }"
                [(ngModel)]="usuario"
                formControlName="usuario"
                type="text"
                class="form-control text-white"
              />
            </div>
            <div class="form-group last mb-4">
              <label for="lbContrasena">Contraseña</label>
              <input
                type="password"
                formControlName="contrasena"
                [(ngModel)]="contrasena"
                [ngClass]="{
                  'is-invalid-input':
                    loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched
                }"
                autocomplete="new-password"
                class="form-control text-white"
                (keydown.enter)="logueo()"
              />
              <div></div>
              <div *ngIf="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched">
                <span class="is-invalid-text">Ingrese el usuario</span>
              </div>
              <div
                *ngIf="loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched"
              >
                <span class="is-invalid-text">Ingrese la Contraseña</span>
              </div>
            </div>

            <button type="submit" class="btn btn-block btn-primary">Ingresar</button>
          </form>
          <div class="version-logueo">
            <p>Version {{ appVersion }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<loading *ngIf="loading"></loading>
<app-alertToast
  *ngIf="showToast"
  [message]="toastMessage"
  [type]="toastType"
  [duration]="5000"
></app-alertToast>
