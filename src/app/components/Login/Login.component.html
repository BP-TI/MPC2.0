<div class="bg-login">
  <div class="row h-100">
    <div class="col-12 col-md-7 col-lg-8">
      <div class="chispas1 d-none d-lg-block">
        <img src="assets/images/Chispas4.png" />
      </div>
      <div class="logo">
        <div class="row d-none d-md-block">
          <div class="col-lg-12 logo-tamanio">
            <img src="assets/images/logoprincipal.png" />
          </div>
        </div>
        <div class="row d-sm-block d-md-none">
          <div class="col-lg-12">
            
          </div>
          <div class="col-lg-12">              
            
          </div>
        </div>
      </div>
      <div class="chispas2 d-none d-lg-block">
        <img src="assets/images/Chispas3.png" />
      </div>
    </div>

    <div class="col-12 col-md-5 col-lg-4">
      <div class="box-logueo">
        <div class="logueo-title">¡Bienvenido(a)!</div>

        <form [formGroup]="loginForm" (ngSubmit)="logueo()" autocomplete="off">
          <div class="campo">
            <input type="text"
                   class="input-logueo"
                   id="usuario" 
                   [(ngModel)]="usuario"
                   placeholder="Usuario"
                   formControlName="usuario"
                   maxlength="50"
                   [ngClass]="{ 'is-invalid-input': loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched }"/>
          </div>
          <div *ngIf="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched">
            <span class="is-invalid-text">Ingrese el Usuario</span>
          </div>

          <div class="campo">
            <input type="password"
                   class="input-logueo"
                   placeholder="Contraseña"
                   formControlName="contrasena"
                   [(ngModel)]="contrasena"
                   placeholder="contrasena"
                   maxlength="20"
                   [ngClass]="{ 'is-invalid-input': loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched }"
                   autocomplete="new-password"
                   (keydown.enter)="logueo()"/>
          </div>
          <div *ngIf="loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched">
            <span class="is-invalid-text">Ingrese la Contraseña</span>
          </div>

          <div class="btn-logueo">
            <button type="submit" class="btn-iniciar-sesion">Ingresar</button>
          </div>
        </form>

        <div class="version-logueo">
          <p>Version {{appVersion}}</p>
        </div>
      </div>
    </div>
  </div>
</div>

<loading *ngIf="loading"></loading>
